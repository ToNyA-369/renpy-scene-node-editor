<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Scene Node Editor</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/vendor/content_editor.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/workspaces/node.css">
  <link rel="stylesheet" href="/css/workspaces/validation.css">
  <link rel="stylesheet" href="/css/editor.css">
  <link rel="stylesheet" href="/css/workspaces/event_numeric.css">
  <link rel="stylesheet" href="/css/workspaces/effect_groups.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-tools">
        <label class="search-field">
          <span class="visually-hidden" data-i18n="搜尋節點">搜尋節點</span>
          <input id="nodeSearch" type="search" placeholder="搜尋節點" data-i18n-placeholder="搜尋節點">
        </label>
        <button class="node-add-button" id="newNodeButton" type="button" title="新增節點" aria-label="新增節點" data-i18n-title="新增節點" data-i18n-aria-label="新增節點">＋</button>
      </div>

      <nav class="node-list" id="nodeList" aria-label="Scene Node 列表" data-i18n-aria-label="Scene Node 列表"></nav>

      <div class="sidebar-footer">
        <div class="project-identity">
          <strong id="projectName" data-i18n="讀取專案中">讀取專案中</strong>
          <span id="projectSummary" data-i18n="0 個節點">0 個節點</span>
        </div>
        <div class="sidebar-footer-actions">
          <button class="icon-button" id="refreshProject" type="button" title="重新掃描專案" aria-label="重新掃描專案" data-i18n-title="重新掃描專案" data-i18n-aria-label="重新掃描專案">↻</button>
          <button class="icon-button" id="settingsButton" type="button" title="編輯器設定" aria-label="編輯器設定" data-i18n-title="編輯器設定" data-i18n-aria-label="編輯器設定">⚙</button>
        </div>
      </div>
    </aside>

    <div class="sidebar-scrim" id="sidebarScrim"></div>

    <main class="main-area">
      <header class="topbar">
        <button class="context-title" id="openSidebar" type="button" title="切換節點列表" aria-label="切換節點列表" data-i18n-title="切換節點列表" data-i18n-aria-label="切換節點列表">
          <span class="context-kicker" id="nodePath" data-i18n="尚未選擇節點">尚未選擇節點</span>
          <h1 id="nodeTitle">Scene Node Editor</h1>
        </button>
        <span class="save-state" id="saveState" role="status" data-i18n="已同步">已同步</span>
        <nav class="tabbar" id="tabbar" aria-label="編輯器分頁" data-i18n-aria-label="編輯器分頁">
          <span class="tab-focus-indicator" id="tabFocusIndicator" aria-hidden="true"></span>
          <button class="tab active" type="button" data-tab="node" data-reorder-id="node" aria-grabbed="false" data-i18n="節點">節點</button>
          <button class="tab" type="button" data-tab="events" data-reorder-id="events" aria-grabbed="false"><span data-i18n="事件">事件</span> <span class="tab-count" id="eventCount">0</span></button>
          <button class="tab" type="button" data-tab="options" data-reorder-id="options" aria-grabbed="false" data-i18n="選項">選項</button>
          <button class="tab" type="button" data-tab="content" data-reorder-id="content" aria-grabbed="false" data-i18n="演出">演出</button>
          <button class="tab" type="button" data-tab="stats" data-reorder-id="stats" aria-grabbed="false" data-i18n="狀態">狀態</button>
          <button class="tab" type="button" data-tab="graph" data-reorder-id="graph" aria-grabbed="false" data-i18n="關聯圖">關聯圖</button>
          <button class="tab" type="button" data-tab="validation" data-reorder-id="validation" aria-grabbed="false"><span data-i18n="檢查">檢查</span> <span class="tab-count issue-count" id="issueCount">0</span></button>
        </nav>
      </header>

      <section class="workspace" id="workspace">
        <div class="empty-state" id="emptyState">
          <div class="empty-symbol" aria-hidden="true">＋</div>
          <h2 data-i18n="建立第一個 Scene Node">建立第一個 Scene Node</h2>
          <button class="primary-button" id="emptyNewNodeButton" type="button" data-i18n="新增節點">新增節點</button>
        </div>

        <section class="tab-panel active" data-panel="node" id="nodePanel"></section>
        <section class="tab-panel" data-panel="events" id="eventsPanel"></section>
        <section class="tab-panel" data-panel="options" id="optionsPanel"></section>
        <section class="tab-panel" data-panel="content" id="contentPanel"></section>
        <section class="tab-panel" data-panel="stats" id="statsPanel"></section>
        <section class="tab-panel" data-panel="graph" id="graphPanel"></section>
        <section class="tab-panel" data-panel="validation" id="validationPanel"></section>
      </section>
    </main>
  </div>

  <dialog class="dialog" id="nodeDialog">
    <form method="dialog" id="nodeDialogForm">
      <div class="dialog-header">
        <div>
          <span class="section-kicker">SCENENODE</span>
          <h2 data-i18n="新增 Scene Node">新增 Scene Node</h2>
        </div>
        <button class="icon-button" type="button" data-close-dialog="nodeDialog" title="關閉" aria-label="關閉" data-i18n-title="關閉" data-i18n-aria-label="關閉">×</button>
      </div>
      <div class="dialog-body form-stack">
        <label class="field">
          <span data-i18n="節點名稱">節點名稱</span>
          <input name="name" required placeholder="請輸入節點顯示名稱" data-i18n-placeholder="請輸入節點顯示名稱">
        </label>
      </div>
      <div class="dialog-actions">
        <button class="quiet-button" type="button" data-close-dialog="nodeDialog" data-i18n="取消">取消</button>
        <button class="primary-button" id="createNodeConfirm" type="submit" value="default" data-i18n="建立節點">建立節點</button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog small-dialog" id="nameDialog">
    <form method="dialog" id="nameDialogForm">
      <div class="dialog-header">
        <div>
          <span class="section-kicker">CONTENT</span>
          <h2 data-i18n="新增 Content">新增 Content</h2>
        </div>
        <button class="icon-button" type="button" data-close-dialog="nameDialog" title="關閉" aria-label="關閉" data-i18n-title="關閉" data-i18n-aria-label="關閉">×</button>
      </div>
      <div class="dialog-body">
        <label class="field">
          <span data-i18n="檔名與 Label">檔名與 Label</span>
          <input id="nameDialogInput" name="name" required autocomplete="off" placeholder="buyWaterNormal">
        </label>
      </div>
      <div class="dialog-actions">
        <button class="quiet-button" type="button" data-close-dialog="nameDialog" data-i18n="取消">取消</button>
        <button class="primary-button" id="nameDialogConfirm" type="submit" value="default" data-i18n="建立">建立</button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog settings-dialog" id="settingsDialog">
    <form method="dialog" id="settingsForm">
      <div class="dialog-header">
        <div>
          <span class="section-kicker">EDITOR</span>
          <h2 data-i18n="編輯器設定">編輯器設定</h2>
        </div>
        <button class="icon-button" type="button" data-close-dialog="settingsDialog" title="關閉" aria-label="關閉" data-i18n-title="關閉" data-i18n-aria-label="關閉">×</button>
      </div>
      <div class="dialog-body settings-body">
        <div class="settings-column settings-primary-column">
          <section class="settings-section">
            <div class="settings-section-heading">
              <strong data-i18n="顯示與語言">顯示與語言</strong>
            </div>
            <label class="setting-row">
              <span><strong data-i18n="介面語言">介面語言</strong></span>
              <select id="editorLanguage">
                <option value="zh-Hant">繁體中文</option>
                <option value="en">English</option>
              </select>
            </label>
          </section>

          <section class="settings-section">
            <div class="settings-section-heading">
              <strong data-i18n="儲存與畫布">儲存與畫布</strong>
            </div>
            <label class="setting-row">
              <span><strong data-i18n="自動儲存">自動儲存</strong></span>
              <input id="autosaveEnabled" type="checkbox">
            </label>
            <label class="setting-row">
              <span><strong data-i18n="儲存延遲">儲存延遲</strong></span>
              <select id="autosaveDelay">
                <option value="400" data-i18n="0.4 秒">0.4 秒</option>
                <option value="700" data-i18n="0.7 秒">0.7 秒</option>
                <option value="1200" data-i18n="1.2 秒">1.2 秒</option>
                <option value="2000" data-i18n="2 秒">2 秒</option>
              </select>
            </label>
            <label class="setting-row">
              <span><strong data-i18n="格線尺寸">格線尺寸</strong></span>
              <input id="gridSize" type="number" min="4" max="160" step="2">
            </label>
          </section>
        </div>

        <section class="settings-section settings-shortcuts-section">
          <div class="settings-section-heading">
            <strong data-i18n="快捷鍵">快捷鍵</strong>
            <button class="quiet-button compact" id="resetShortcuts" type="button" data-i18n="恢復預設">恢復預設</button>
          </div>
          <div class="shortcut-list" id="shortcutList"></div>
        </section>
      </div>
      <div class="dialog-actions">
        <button class="primary-button" type="submit" value="default" data-i18n="完成">完成</button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog textbox-profile-dialog" id="textboxProfileDialog">
    <form id="textboxProfileForm">
      <div class="dialog-header">
        <div>
          <span class="section-kicker">TEXTBOX</span>
          <h2 data-i18n="外觀設定檔">外觀設定檔</h2>
        </div>
        <button class="icon-button" type="button" data-close-dialog="textboxProfileDialog" title="關閉" aria-label="關閉" data-i18n-title="關閉" data-i18n-aria-label="關閉">×</button>
      </div>
      <div class="dialog-body textbox-profile-body">
        <aside class="textbox-profile-sidebar">
          <button class="quiet-button compact add-button" id="newTextboxProfile" type="button" data-i18n="新增設定檔">新增設定檔</button>
          <div class="subnav-list" id="textboxProfileList"></div>
        </aside>
        <section class="textbox-profile-editor" id="textboxProfileEditor"></section>
      </div>
      <div class="dialog-actions textbox-profile-actions">
        <button class="danger-button" id="deleteTextboxProfile" type="button" data-i18n="刪除設定檔">刪除設定檔</button>
        <span class="dialog-action-spacer"></span>
        <button class="quiet-button" type="button" data-close-dialog="textboxProfileDialog" data-i18n="取消">取消</button>
        <button class="primary-button" id="saveTextboxProfile" type="submit" data-i18n="儲存設定檔">儲存設定檔</button>
      </div>
    </form>
  </dialog>

  <datalist id="statNames"></datalist>
  <datalist id="nodeNames"></datalist>
  <datalist id="contentNames"></datalist>
  <datalist id="imageAssets"></datalist>

  <div class="toast-region" id="toastRegion" aria-live="polite"></div>

  <script src="/js/core/i18n.js" defer></script>
  <script src="/js/core/api_client.js" defer></script>
  <script src="/js/core/editor_settings.js" defer></script>
  <script src="/js/core/undo_coordinator.js" defer></script>
  <script src="/js/core/event_contract.js" defer></script>
  <script src="/js/core/state_rule_contract.js" defer></script>
  <script src="/js/core/group_tree.js" defer></script>
  <script src="/js/core/effect_groups.js" defer></script>
  <script src="/js/ui/type_badge.js" defer></script>
  <script src="/js/ui/choice_picker.js" defer></script>
  <script src="/js/ui/prefix_picker.js" defer></script>
  <script src="/js/ui/group_drag.js" defer></script>
  <script src="/js/ui/list_reorder.js" defer></script>
  <script src="/js/ui/workspace_tab_reorder.js" defer></script>
  <script src="/js/workspaces/graph_model.js" defer></script>
  <script src="/js/workspaces/graph_layout_client.js" defer></script>
  <script src="/js/workspaces/textbox_profiles.js" defer></script>
  <script src="/js/workspaces/content_editor_support.js" defer></script>
  <script src="/js/workspaces/state_editor.js" defer></script>
  <script src="/js/ui/numeric_field.js" defer></script>
  <script src="/js/workspaces/event_editor.js" defer></script>
  <script src="/js/workspaces/event_focus_navigation.js" defer></script>
  <script src="/js/workspaces/node_workspace.js" defer></script>
  <script src="/js/workspaces/validation_workspace.js" defer></script>
  <script src="/js/core/autosave_coordinator.js" defer></script>
  <script src="/vendor/content_editor.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
