<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Scene Node Editor</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-tools">
        <label class="search-field">
          <span class="visually-hidden">搜尋節點</span>
          <input id="nodeSearch" type="search" placeholder="搜尋節點">
        </label>
        <button class="node-add-button" id="newNodeButton" type="button" title="新增節點" aria-label="新增節點">＋</button>
      </div>

      <nav class="node-list" id="nodeList" aria-label="Scene Node 列表"></nav>

      <div class="sidebar-footer">
        <div class="project-identity">
          <strong id="projectName">讀取專案中</strong>
          <span id="projectSummary">0 個節點</span>
        </div>
        <div class="sidebar-footer-actions">
          <button class="icon-button" id="refreshProject" type="button" title="重新掃描專案" aria-label="重新掃描專案">↻</button>
          <button class="icon-button" id="settingsButton" type="button" title="編輯器設定" aria-label="編輯器設定">⚙</button>
        </div>
      </div>
    </aside>

    <div class="sidebar-scrim" id="sidebarScrim"></div>

    <main class="main-area">
      <header class="topbar">
        <button class="context-title" id="openSidebar" type="button" title="切換節點列表" aria-label="切換節點列表">
          <span class="context-kicker" id="nodePath">尚未選擇節點</span>
          <h1 id="nodeTitle">Scene Node Editor</h1>
        </button>
        <span class="save-state" id="saveState" role="status">已同步</span>
        <nav class="tabbar" id="tabbar" aria-label="編輯器分頁">
          <span class="tab-focus-indicator" id="tabFocusIndicator" aria-hidden="true"></span>
          <button class="tab active" type="button" data-tab="node">節點</button>
          <button class="tab" type="button" data-tab="events">事件 <span class="tab-count" id="eventCount">0</span></button>
          <button class="tab" type="button" data-tab="options">選項</button>
          <button class="tab" type="button" data-tab="content">演出</button>
          <button class="tab" type="button" data-tab="stats">狀態</button>
          <button class="tab" type="button" data-tab="graph">關聯圖</button>
          <button class="tab" type="button" data-tab="validation">檢查 <span class="tab-count issue-count" id="issueCount">0</span></button>
        </nav>
      </header>

      <section class="workspace" id="workspace">
        <div class="empty-state" id="emptyState">
          <div class="empty-symbol" aria-hidden="true">＋</div>
          <h2>建立第一個 Scene Node</h2>
          <button class="primary-button" id="emptyNewNodeButton" type="button">新增節點</button>
        </div>

        <section class="tab-panel active" data-panel="node" id="nodePanel"></section>
        <section class="tab-panel" data-panel="events" id="eventsPanel"></section>
        <section class="tab-panel" data-panel="options" id="optionsPanel"></section>
        <section class="tab-panel" data-panel="content" id="contentPanel"></section>
        <section class="tab-panel" data-panel="stats" id="statsPanel"></section>
        <section class="tab-panel" data-panel="graph" id="graphPanel"></section>
        <section class="tab-panel" data-panel="validation" id="validationPanel"></section>
      </section>
    </main>
  </div>

  <dialog class="dialog" id="nodeDialog">
    <form method="dialog" id="nodeDialogForm">
      <div class="dialog-header">
        <div>
          <span class="section-kicker">SCENENODE</span>
          <h2>新增 Scene Node</h2>
        </div>
        <button class="icon-button" type="button" data-close-dialog="nodeDialog" title="關閉" aria-label="關閉">×</button>
      </div>
      <div class="dialog-body form-stack">
        <label class="field">
          <span>節點名稱</span>
          <input name="name" required placeholder="請輸入節點顯示名稱">
        </label>
      </div>
      <div class="dialog-actions">
        <button class="quiet-button" type="button" data-close-dialog="nodeDialog">取消</button>
        <button class="primary-button" id="createNodeConfirm" type="submit" value="default">建立節點</button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog small-dialog" id="nameDialog">
    <form method="dialog" id="nameDialogForm">
      <div class="dialog-header">
        <div>
          <span class="section-kicker">CONTENT</span>
          <h2>新增 Content</h2>
        </div>
        <button class="icon-button" type="button" data-close-dialog="nameDialog" title="關閉" aria-label="關閉">×</button>
      </div>
      <div class="dialog-body">
        <label class="field">
          <span>檔名與 Label</span>
          <input id="nameDialogInput" name="name" required autocomplete="off" placeholder="buyWaterNormal">
        </label>
      </div>
      <div class="dialog-actions">
        <button class="quiet-button" type="button" data-close-dialog="nameDialog">取消</button>
        <button class="primary-button" id="nameDialogConfirm" type="submit" value="default">建立</button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog settings-dialog" id="settingsDialog">
    <form method="dialog" id="settingsForm">
      <div class="dialog-header">
        <div>
          <span class="section-kicker">EDITOR</span>
          <h2>編輯器設定</h2>
        </div>
        <button class="icon-button" type="button" data-close-dialog="settingsDialog" title="關閉" aria-label="關閉">×</button>
      </div>
      <div class="dialog-body settings-body">
        <section class="settings-section">
          <div class="settings-section-heading">
            <strong>儲存與畫布</strong>
          </div>
          <label class="setting-row">
            <span><strong>自動儲存</strong><small>停止輸入後自動寫入專案</small></span>
            <input id="autosaveEnabled" type="checkbox">
          </label>
          <label class="setting-row">
            <span><strong>儲存延遲</strong><small>連續輸入時等待多久再儲存</small></span>
            <select id="autosaveDelay">
              <option value="400">0.4 秒</option>
              <option value="700">0.7 秒</option>
              <option value="1200">1.2 秒</option>
              <option value="2000">2 秒</option>
            </select>
          </label>
          <label class="setting-row">
            <span><strong>格線尺寸</strong><small>選項畫布的吸附間距</small></span>
            <input id="gridSize" type="number" min="4" max="160" step="2">
          </label>
        </section>

        <section class="settings-section">
          <div class="settings-section-heading">
            <strong>快捷鍵</strong>
            <button class="quiet-button compact" id="resetShortcuts" type="button">恢復預設</button>
          </div>
          <div class="shortcut-list" id="shortcutList"></div>
        </section>
      </div>
      <div class="dialog-actions">
        <button class="primary-button" type="submit" value="default">完成</button>
      </div>
    </form>
  </dialog>

  <datalist id="statNames"></datalist>
  <datalist id="nodeNames"></datalist>
  <datalist id="contentNames"></datalist>
  <datalist id="imageAssets"></datalist>

  <div class="toast-region" id="toastRegion" aria-live="polite"></div>

  <script src="/js/core/api_client.js" defer></script>
  <script src="/js/core/editor_settings.js" defer></script>
  <script src="/js/core/event_contract.js" defer></script>
  <script src="/js/ui/choice_picker.js" defer></script>
  <script src="/js/workspaces/graph_model.js" defer></script>
  <script src="/js/core/autosave_coordinator.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
